<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Story scroll regression check</title>
<style>
  body { margin: 24px; font: 16px/1.5 system-ui, sans-serif; color: #202830; }
  nav { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  iframe { display: block; border: 1px solid #aab4bc; }
  .pass { color: #17663a; } .fail { color: #a32020; }
  #status { font-weight: 700; } #results { max-width: 90ch; }
</style>
<h1>Story scroll regression check</h1>
<p>Serve the repository over HTTP and open this page. The iframe runs the real article.
  Use <code>?width=320&amp;height=568&amp;lang=de</code> for another viewport or language.
  Reduced motion follows the browser setting.</p>
<nav id="sizes"></nav>
<p id="status">Loading…</p>
<iframe id="article" title="Article under test"></iframe>
<ol id="results"></ol>
<script>
'use strict';
const query = new URLSearchParams(location.search);
const width = Math.max(280, Math.min(1800, Number(query.get('width')) || 390));
const height = Math.max(320, Math.min(1200, Number(query.get('height')) || 844));
const language = query.get('lang') === 'de' ? 'de' : 'en';
const frame = document.querySelector('#article');
const status = document.querySelector('#status');
const result = window.storyScrollResult = { status: 'running', width, height, language, checks: [] };
for (const [w, h] of [[390, 844], [320, 568], [844, 390], [1440, 900]]) {
  const link = document.createElement('a');
  link.href = `?width=${w}&height=${h}&lang=${language}`;
  link.textContent = `${w} × ${h}`;
  document.querySelector('#sizes').append(link);
}
frame.style.width = `${width}px`;
frame.style.height = `${height}px`;
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(predicate, message, timeout = 3000) {
  const end = performance.now() + timeout;
  while (performance.now() < end) {
    if (predicate()) return;
    await pause(30);
  }
  throw new Error(message);
}
function check(condition, message) {
  if (!condition) throw new Error(message);
  result.checks.push(message);
  const item = document.createElement('li');
  item.className = 'pass'; item.textContent = `PASS: ${message}`;
  document.querySelector('#results').append(item);
}
frame.addEventListener('load', async () => {
  const win = frame.contentWindow, doc = frame.contentDocument;
  try {
    await until(() => doc.documentElement.dataset.storyReady === 'true', 'Article did not initialize');
    await Promise.race([doc.fonts.ready, pause(3000)]);
    // The article intentionally pauses offscreen graphics. Keep the iframe in
    // view so parent-page clipping does not pause the animation under test.
    frame.scrollIntoView({ block: 'start', behavior: 'instant' });
    const chapters = [...doc.querySelectorAll('.chapter')];
    // Cloned, fixed mobile scenes are the regression: fail before testing later behavior.
    check(chapters.length === 6 && chapters.every(chapter => chapter.querySelectorAll('.graphic').length === 1),
      `One shared graphic per chapter (found ${doc.querySelectorAll('.graphic').length} graphics in ${chapters.length} chapters)`);
    const graphics = chapters.map(chapter => chapter.querySelector('.graphic'));
    const walk = graphics[0].querySelector('.cw');
    check(doc.querySelectorAll('.cw').length === 1, 'One walkthrough serves every cipher stage');
    async function settleScroll() {
      let stable = 0, last = win.scrollY;
      await until(() => {
        const current = win.scrollY;
        stable = Math.abs(current - last) < 1 ? stable + 1 : 0;
        last = current;
        return stable >= 3;
      }, 'Article scrolling did not settle');
    }
    async function visit(target, graphic, expected, actual) {
      const css = win.getComputedStyle(graphic);
      const stacked = width <= 900 && doc.documentElement.dataset.storyLayout !== 'side';
      const panelBottom = (parseFloat(css.top) || 0) + graphic.getBoundingClientRect().height;
      // Approach through the visible prose, not the controller's activation formula.
      const readingTop = stacked ? panelBottom : 0;
      const start = stacked ? Math.min(height - 24, readingTop + 120) : height / 2;
      win.scrollTo({ top: win.scrollY + target.getBoundingClientRect().top - start, behavior: 'instant' });
      await settleScroll();
      for (let n = 0; actual() !== expected && n < 24; n++) {
        if (target.getBoundingClientRect().top < readingTop - 20) break;
        win.scrollBy({ top: 10, behavior: 'instant' });
        await pause(35);
      }
      await until(() => actual() === expected, `Scroll target ${expected}: got ${actual()}`, 600);
      check(actual() === expected, `Scroll selects ${expected}`);
    }
    function visible(graphic, label) {
      const rect = graphic.getBoundingClientRect();
      const stacked = width <= 900 && doc.documentElement.dataset.storyLayout !== 'side';
      check(rect.width > 0 && (stacked ? rect.top >= -2 && rect.bottom <= height + 2 : rect.bottom > 0 && rect.top < height), `${label}: graphic is visible in the viewport`);
    }
    async function walkthroughGeometry(stage) {
      if (stage === 7) await until(() => walk.dataset.finale === 'settled', 'Final message animation did not settle', 6500);
      else await until(() => !doc.getAnimations().some(animation => walk.contains(animation.effect?.target) && ['running', 'pending'].includes(animation.playState)), 'Walkthrough animation did not settle');
      visible(graphics[0], `Stage ${stage}`);
      const controls = walk.querySelector('.cw-controls').getBoundingClientRect();
      const scene = walk.querySelector('.cw-scene').getBoundingClientRect();
      const content = [...walk.querySelectorAll('.cw-scene *')].map(el => el.getBoundingClientRect()).filter(rect => rect.width && rect.height);
      const contained = (width <= 900 && doc.documentElement.dataset.storyLayout !== 'side') || graphics[0].getBoundingClientRect().top <= 2;
      check((!contained || controls.top >= 0 && controls.bottom <= height + 2) && scene.bottom <= controls.top + 1 && content.every(rect => rect.bottom <= controls.top + 1), `Stage ${stage}: scene and controls do not overlap`);
    }
    const targets = [...chapters[0].querySelectorAll('[data-walk-stage]')];
    for (const stage of [0, 1, 2, 3, 4, 5, 6, 7, 6, 5, 4, 3, 2, 1, 0]) {
      await visit(targets.find(target => Number(target.dataset.walkStage) === stage), graphics[0], String(stage), () => walk.dataset.stage);
      check(chapters[0].querySelector('.cw') === walk, `Stage ${stage}: same walkthrough element`);
      await walkthroughGeometry(stage);
    }
    await visit(targets.find(target => target.dataset.walkStage === '3'), graphics[0], '3', () => walk.dataset.stage);
    for (const [selector, expected, direction] of [['.cw-next', '4', 1], ['.cw-previous', '3', -1]]) {
      const before = win.scrollY;
      walk.querySelector(selector).click();
      await until(() => walk.dataset.stage === expected, `Button did not select stage ${expected}`);
      await settleScroll();
      check((win.scrollY - before) * direction > 5, `Button moves the article to stage ${expected}`);
      win.scrollBy({ top: 8, behavior: 'instant' });
      await settleScroll();
      check(walk.dataset.stage === expected, `Small scroll preserves button-selected stage ${expected}`);
    }
    await visit(targets.find(target => target.dataset.walkStage === '7'), graphics[0], '7', () => walk.dataset.stage);
    walk.querySelector('.cw-next').click();
    await walkthroughGeometry(7);
    check(walk.dataset.stage === '7', 'Replay stays on the final stage');
    for (let index = 1; index < chapters.length; index++) {
      const graphic = graphics[index], steps = [...chapters[index].querySelectorAll('.step[data-s]')];
      for (const step of [...steps, ...steps.slice(0, -1).reverse()]) {
        await visit(step, graphic, step.dataset.s, () => graphic.dataset.state);
        check(chapters[index].querySelector('.graphic') === graphic, `Chapter ${index + 1}: same graphic at ${step.dataset.s}`);
        visible(graphic, step.dataset.s);
      }
    }
    check(doc.documentElement.scrollWidth <= width + 1, 'Article has no horizontal overflow');
    result.status = 'passed'; status.className = 'pass';
    status.textContent = `PASS: ${result.checks.length} checks at ${width} × ${height} (${language})`;
  } catch (error) {
    result.status = 'failed'; result.error = error.message; status.className = 'fail';
    status.textContent = `FAIL: ${error.message}`;
  }
}, { once: true });
frame.src = `../docs/${language === 'de' ? 'de/' : ''}index.html`;
</script>
</html>
