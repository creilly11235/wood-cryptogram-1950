<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Story navigation regression check</title>
<style>
  body { margin: 24px; font: 16px/1.5 system-ui, sans-serif; color: #202830; }
  nav { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  iframe { display: block; border: 1px solid #aab4bc; }
  .pass { color: #17663a; } .fail { color: #a32020; }
  #status { font-weight: 700; } #results { max-width: 90ch; }
</style>
<h1>Story navigation regression check</h1>
<p>Serve the repository over HTTP and open this page. It tests the real article’s pinned graphics
  at every size (one card per stage rising over the full-screen graphic). Use
  <code>?width=320&amp;height=568&amp;lang=de</code> for another viewport or language.</p>
<nav id="sizes"></nav>
<p id="status">Loading…</p>
<iframe id="article" title="Article under test"></iframe>
<ol id="results"></ol>
<script>
'use strict';
const query = new URLSearchParams(location.search);
const width = Math.max(280, Math.min(1800, Number(query.get('width')) || 390));
const height = Math.max(320, Math.min(1200, Number(query.get('height')) || 844));
const language = query.get('lang') === 'de' ? 'de' : 'en';
const frame = document.querySelector('#article');
const status = document.querySelector('#status');
const result = window.storyScrollResult = { status: 'running', width, height, language, checks: [] };
for (const [w, h] of [[390, 844], [320, 568], [844, 390], [1440, 900]]) {
  const link = document.createElement('a');
  link.href = `?width=${w}&height=${h}&lang=${language}`;
  link.textContent = `${w} × ${h}`;
  document.querySelector('#sizes').append(link);
}
frame.style.width = `${width}px`;
frame.style.height = `${height}px`;
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(predicate, message, timeout = 4000) {
  const end = performance.now() + timeout;
  while (performance.now() < end) {
    if (predicate()) return;
    await pause(30);
  }
  throw new Error(message);
}
function check(condition, message) {
  if (!condition) throw new Error(message);
  result.checks.push(message);
  const item = document.createElement('li');
  item.className = 'pass'; item.textContent = `PASS: ${message}`;
  document.querySelector('#results').append(item);
}
frame.addEventListener('load', async () => {
  const win = frame.contentWindow, doc = frame.contentDocument;
  try {
    await until(() => doc.documentElement.dataset.storyReady === 'true', 'Article did not initialize');
    await Promise.race([doc.fonts.ready, pause(3000)]);
    frame.scrollIntoView({ block: 'start', behavior: 'instant' });
    const chapters = [...doc.querySelectorAll('.chapter')];
    const graphics = chapters.map(chapter => chapter.querySelector('.graphic'));
    const walk = graphics[0].querySelector('.cw');
    check(chapters.length === 6 && graphics.every(Boolean) && doc.querySelectorAll('.graphic').length === 6,
      'Six original graphics serve every stage at every width');
    check(doc.querySelectorAll('.cw').length === 1, 'One walkthrough serves every cipher stage');
    check(doc.querySelectorAll('.mobile-story-card, .mobile-story-dialog, .story-run').length === 0, 'No mobile card, viewer or runway remains');
    check(!!win.WoodStoryController && win.WoodStoryController.records.length === 6, 'The scroll controller drives all six chapters');
    const lastStage = target => target.dataset.walkStage.trim().split(/\s+/).at(-1);
    const focal = height * (width > height ? .8 : height < 640 ? .76 : .72);
    async function settle() {
      await pause(160);
      let stable = 0, last = win.scrollY;
      await until(() => {
        const y = win.scrollY;
        stable = Math.abs(y - last) < 1 ? stable + 1 : 0;
        last = y;
        return stable >= 3;
      }, 'Article scrolling did not settle');
    }
    function overflow(label) {
      check(doc.documentElement.scrollWidth <= win.innerWidth + 1, `${label}: no horizontal overflow`);
    }
    // Each card selects its stage, the graphic stays behind it, and scrolling
    // back restores the stage of the card returned to.
    async function followsProse(index, label) {
      const chapter = chapters[index], graphic = graphics[index];
      const targets = [...chapter.querySelectorAll('.pin > .text [data-walk-stage]')];
      check(targets.length > 0, `${label}: has passages that drive the graphic`);
      const expected = target => index === 0 ? lastStage(target) : target.dataset.s;
      const shown = () => index === 0 ? walk.dataset.stage : graphic.dataset.state;
      for (const target of [...targets, ...targets.slice(0, -1).reverse()]) {
        const place = target.getBoundingClientRect();
        // Centre the card on its focal line.
        win.scrollTo({ top: win.scrollY + (place.top + place.bottom) / 2 - focal, behavior: 'instant' });
        await settle();
        await until(() => shown() === expected(target), `${label}: scroll did not reach ${expected(target)}`, 6000);
        check(target.classList.contains('is-walk-active') && chapter.querySelectorAll('.is-walk-active').length === 1,
          `${label}: the passage for ${expected(target)} is marked as current`);
        const box = graphic.getBoundingClientRect();
        check(box.width > 0 && box.bottom > 0 && box.top < height && box.top >= -1 && Number(getComputedStyle(target).opacity) > .9,
          `${label}: ${expected(target)} shows with the graphic behind a fully visible card`);
        check([...chapter.querySelectorAll('.pin > .text [data-walk-stage]')].filter(card => Number(getComputedStyle(card).opacity) > .5).length === 1,
          `${label}: only the card for ${expected(target)} is readable`);
        overflow(label);
      }
    }
    check(graphics.every(graphic => graphic.parentElement.matches('.chapter > .pin') && getComputedStyle(graphic).position === 'sticky'),
      'Every graphic stays pinned in its chapter');
    // The graphic holds on its first state for a while after the introduction has gone.
    for (let i = 0; i < chapters.length; i++) {
      const graphic = graphics[i];
      win.scrollTo({ top: 0, behavior: 'instant' });
      await settle();
      const pin = win.scrollY + graphic.getBoundingClientRect().top;
      win.scrollTo({ top: pin, behavior: 'instant' });
      await settle();
      const card = chapters[i].querySelector('.pin > .text [data-walk-stage]').getBoundingClientRect();
      check(graphic.getBoundingClientRect().top <= 1 && card.top >= height, `Chapter ${i + 1}: the first card arrives after the graphic pins`);
    }
    for (let i = 0; i < chapters.length; i++) await followsProse(i, `Chapter ${i + 1}`);
    result.status = 'passed'; status.className = 'pass';
    status.textContent = `PASS: ${result.checks.length} checks at ${width} × ${height} (${language})`;
  } catch (error) {
    result.status = 'failed'; result.error = error.message; status.className = 'fail';
    status.textContent = `FAIL: ${error.message}`;
  }
}, { once: true });
frame.src = `../docs/${language === 'de' ? 'de/' : ''}index.html`;
</script>
</html>
