<!doctype html>
<!--
Link-preview card for the blog post (docs/card.png, docs/de/card.png): 1200x630, in the page's type and colours.
Open this file in a browser at a 1200x630 viewport with query parameters, wait for the fonts, and screenshot it.
  kick, title, sv, foot   the four lines of text (sv is the status before the footer)
  --size, --measure       title size and maximum width, to fit longer titles
English: kick=Proceedings of the S.P.R., vol. 49 · No. 35 of Klaus Schmeh's Top 50
         title=Solving the 1950 cipher meant to test life after death  sv=Solved
         foot=after 76 years · confirmed October 4–6, 2026  --size=64px  --measure=1040px
German:  kick=Proceedings of the S.P.R., Bd. 49 · Nr. 35 auf Klaus Schmehs Top-50-Liste
         title=Die Lösung des Kryptogramms von 1950, das ein Leben nach dem Tod prüfen sollte  sv=Gelöst
         foot=nach 76 Jahren · bestätigt am 4.–6. Oktober 2026  --size=58px  --measure=1040px
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400&family=Courier+Prime:wght@400&display=block" rel="stylesheet">
<style>
:root{--room:#fafbfc;--room-2:#f0f2f4;--bone:#282e35;--bone-2:#5b646e;--veil-2:#d3d9df;
  --cipher-encoded-bg:#282e35;--cipher-encoded-fg:#fafbfc;--cipher-encoded-border:#282e35;
  --cipher-decoded-bg:#e4f1ed;--cipher-decoded-fg:#18584f;--cipher-decoded-border:#26796c;
  --body:"Libre Caslon Text",Georgia,serif;--mono:"Courier Prime",monospace}
html,body{margin:0;background:var(--room)}
.card{width:1200px;height:630px;box-sizing:border-box;padding:36px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--bone)}
.kick{font:400 24px/1.5 var(--body);color:var(--bone-2);margin:0}
h1{font:400 var(--size,64px)/1.2 var(--body);letter-spacing:-.025em;margin:var(--h1-top,28px) 0 0;max-width:var(--measure,1040px);text-wrap:balance}
.tiles{display:flex;gap:16px;margin-top:var(--tiles-top,36px)}
.grp{display:flex;gap:5px}
.t{width:40px;height:50px;display:grid;place-items:center;padding-top:3px;box-sizing:border-box;background:var(--bone);border:1px solid var(--bone);color:var(--room);font:400 24px/1 var(--mono);border-radius:1px}
.foot{margin:var(--foot-top,32px) 0 0;font:400 24px/1.5 var(--body);color:var(--bone-2)}
.foot .sv{color:var(--bone)}
.foot .sv::after{content:" · ";color:var(--bone-2)}
</style>
<link rel="stylesheet" href="../docs/cipher-cards.css">
</head>
<body><div class="card">
<p class="kick" id="kick"></p>
<h1 id="title"></h1>
<div class="tiles" id="tiles"></div>
<p class="foot"><span class="sv" id="sv"></span><span id="foot"></span></p>
</div>
<script>
const q = new URLSearchParams(location.search);
for (const k of ["kick", "title", "sv", "foot"]) document.getElementById(k).textContent = q.get(k) || "";
for (const [k, v] of q) if (k.startsWith("--")) document.documentElement.style.setProperty(k, v);
const tiles = document.getElementById("tiles");
for (const g of "FVAMI NTKFX XWATB OIZVV X".split(" ")) {
  const d = document.createElement("div"); d.className = "grp";
  for (const c of g) { const t = document.createElement("div"); t.className = "t encoded"; t.textContent = c; d.appendChild(t); }
  tiles.appendChild(d);
}
</script></body></html>
