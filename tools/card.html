<!doctype html>
<!--
Link-preview card for the blog post (docs/card.png, docs/de/card.png): 1200x630, in the page's type and colours.
Open this file in a browser at a 1200x630 viewport with query parameters, wait for the fonts, and screenshot it.
  kick, title, sv, foot   the four lines of text (sv is the small-caps word before the footer)
  --size, --measure       title size and maximum width, to fit longer titles
English: kick=Proceedings of the S.P.R., vol. 49 · No. 35 of Klaus Schmeh's Top 50
         title=Solving the 1950 cipher meant to test life after death  sv=Solved
         foot=after 76 years · confirmed 4 October 2026  --measure=900px
German:  kick=Proceedings of the S.P.R., Bd. 49 · Nr. 35 auf Klaus Schmehs Top-50-Liste
         title=Die Lösung des Kryptogramms von 1950, das ein Leben nach dem Tod prüfen sollte  sv=Gelöst
         foot=nach 76 Jahren · bestätigt am 4. Oktober 2026  --size=68px  --measure=960px
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@700&display=block" rel="stylesheet">
<style>
:root{--room:#17120e;--bone:#e8dfcb;--bone-2:#b4a78f;--bone-3:#857864;--ink:#1c1611;--candle:#b8873a;
  --display:"Libre Caslon Display",Georgia,serif;--body:"Libre Caslon Text",Georgia,serif;--mono:"Courier Prime",monospace}
html,body{margin:0;background:var(--room)}
.card{width:1200px;height:630px;box-sizing:border-box;padding:0 60px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--bone)}
.kick{font:italic 26px/1.3 var(--body);color:var(--bone-3);margin:0}
h1{font:400 var(--size,76px)/1.08 var(--display);margin:var(--h1-top,25px) 0 0;max-width:var(--measure,700px);text-wrap:balance}
.tiles{display:flex;gap:16px;margin-top:var(--tiles-top,42px)}
.grp{display:flex;gap:5px}
.t{width:40px;height:47px;display:grid;place-items:center;padding-top:3px;box-sizing:border-box;background:var(--bone);color:var(--ink);font:700 23px/1 var(--mono);border-radius:1px}
.foot{margin:var(--foot-top,43px) 0 0;font:italic 26px/1.3 var(--body);color:var(--bone-2)}
.foot .sv{font:400 19px/1 var(--body);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--candle);margin-right:.35em}
</style></head>
<body><div class="card">
<p class="kick" id="kick"></p>
<h1 id="title"></h1>
<div class="tiles" id="tiles"></div>
<p class="foot"><span class="sv" id="sv"></span><span id="foot"></span></p>
</div>
<script>
const q = new URLSearchParams(location.search);
for (const k of ["kick", "title", "sv", "foot"]) document.getElementById(k).textContent = q.get(k) || "";
for (const [k, v] of q) if (k.startsWith("--")) document.documentElement.style.setProperty(k, v);
const tiles = document.getElementById("tiles");
for (const g of "FVAMI NTKFX XWATB OIZVV X".split(" ")) {
  const d = document.createElement("div"); d.className = "grp";
  for (const c of g) { const t = document.createElement("div"); t.className = "t"; t.textContent = c; d.appendChild(t); }
  tiles.appendChild(d);
}
</script></body></html>
